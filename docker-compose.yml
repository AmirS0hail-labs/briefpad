services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: briefpad
      POSTGRES_PASSWORD: briefpad
      POSTGRES_DB: briefpad
    ports:
      - "5433:5432"
    volumes:
      - briefpad_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefpad -d briefpad"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  briefpad_pg:
